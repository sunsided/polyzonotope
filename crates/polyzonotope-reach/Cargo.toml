[package]
name = "polyzonotope-reach"
description = "Validated reachable-set over-approximation of nonlinear dynamics with polynomial zonotopes"
# The first release; later versions come from release-plz (0.0.0 only claimed the name).
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/sunsided/polyzonotope"
readme = "README.md"
keywords = ["reachability", "zonotope", "verification", "set-based", "dynamics"]
categories = ["mathematics", "science", "no-std"]

[dependencies]
polyzonotope = { version = "0.3", path = "../..", default-features = false }

nalgebra = { version = "0.35", default-features = false, features = ["alloc", "libm"] }
libm = "0.2"

[features]
default = ["std"]
std = ["polyzonotope/std"]
# Outward rounding, see the polyzonotope crate's `sound` feature.
sound = ["std", "polyzonotope/sound"]

[lints]
workspace = true

[dev-dependencies]
# The tests' reference solution uses nalgebra's matrix exponential, which needs std.
nalgebra = { version = "0.35", features = ["std"] }
proptest = "1"
criterion = "0.8"

[[bench]]
name = "nonlinear"
harness = false
