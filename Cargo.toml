[package]
name = "polyzonotope"
description = "Sparse polynomial zonotopes, zonotopes and interval boxes for set-based reachability analysis"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/sunsided/polyzonotope"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[dependencies]
nalgebra = "0.35"

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "operations"
harness = false
