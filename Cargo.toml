[workspace]
members = ["crates/polyzonotope-reach"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[package]
name = "polyzonotope"
description = "Sparse polynomial zonotopes, zonotopes and interval boxes for set-based reachability analysis, no_std and optionally with outward rounding"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/sunsided/polyzonotope"
readme = "README.md"
keywords = ["zonotope", "polynomial-zonotope", "reachability", "set-based", "verification"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]
# all-features enables `sound`, whose inari dependency needs AVX2 and FMA on x86-64.
rustc-args = ["-C", "target-cpu=haswell"]

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["alloc", "libm"] }
portable-atomic = "1"
inari = { version = "2", default-features = false, optional = true }

[features]
default = ["std"]
# Uses `f64::powi` from std for monomial powers; without it, powers fall back to repeated squaring.
std = ["nalgebra/std"]
# Outward rounding via inari: enclosures are rounded outward and the exact operations add
# generators that bound their rounding error. Needs x86-64 Haswell or newer (build with
# `-C target-cpu=haswell`) or AArch64; see the README.
sound = ["std", "dep:inari"]

[dev-dependencies]
criterion = "0.8"
plotters = { version = "0.3", default-features = false, features = ["svg_backend"] }
proptest = "1"

[lints]
workspace = true

[[bench]]
name = "operations"
harness = false

# The reachability crate's Monte Carlo and mutation tests take minutes without
# optimization. opt-level 1 keeps debug assertions and overflow checks on.
[profile.test]
opt-level = 1
