[workspace]
# Versions come from git tags; release-plz tags and creates GitHub Releases but never runs
# cargo publish. publish-crates-io.yml publishes from the tag (tag-restricted `crates-io` environment).
git_only = true
# Release only when the release PR is merged, not on every push that bumps a version.
release_always = false
# Runs cargo-semver-checks on library crates; API breaks force a major bump.
semver_check = true
changelog_update = true
git_release_enable = true
# Versions are SemVer 2.0; pre-release versions (1.2.0-rc.1) become GitHub pre-releases.
git_release_type = "auto"
# Release PR branches follow the branching model (release/*), not the default `release-plz-`.
pr_branch_prefix = "release/"
# Imperative PR title (the default is "chore: release v..."); squash merges use it as the subject,
# and the changelog parser skips it via ^Release. One released crate: {{ version }} is always set.
pr_name = "Release v{{ version }}"
# Commits are imperative ("Add X", "Fix Y"), not Conventional Commits: map verbs to bumps.
custom_minor_increment_regex = "^(Add|Introduce|Support|Allow|Implement|Expose)\\b"
custom_major_increment_regex = "(?m)^BREAKING CHANGE:|^Break\\b"
# Tag names: release-plz defaults to "v{{ version }}" with one public crate and
# "{{ package }}-v{{ version }}" with several. Leave unset to keep those defaults.

[changelog]
commit_parsers = [
  { message = "^(Merge|Release|Bump version)\\b", skip = true },
  # Dependabot subjects carry an ecosystem prefix (.github/dependabot.yml).
  { message = "^Actions: ", skip = true },
  { message = "^(Add|Introduce|Support|Allow|Implement|Expose)\\b", group = "Added" },
  { message = "^(Fix|Correct|Resolve|Prevent|Repair)\\b", group = "Fixed" },
  { message = "^Deprecate\\b", group = "Deprecated" },
  { message = "^(Remove|Drop|Delete)\\b", group = "Removed" },
  { message = "^(Secure|Harden)\\b", group = "Security" },
  { message = "^((Cargo|npm|Docker): )?Bump\\b", group = "Dependencies" },
  { message = "^.*", group = "Changed" },
]

# The main crate keeps plain vX.Y.Z tags; publish-crates-io.yml maps those to polyzonotope.
[[package]]
name = "polyzonotope"
git_tag_name = "v{{ version }}"

# Explicit, because the default tag form depends on how many crates are public: a second
# crate must never fall back to plain vX.Y.Z and collide with the main crate's tags.
[[package]]
name = "polyzonotope-reach"
git_tag_name = "polyzonotope-reach-v{{ version }}"

# Per-crate overrides. Examples:
# [[package]]
# name = "my-crate"
# git_tag_name = "v{{ version }}"   # the main crate of a multi-crate repo keeps plain vX.Y.Z tags
#
# [[package]]
# name = "internal-helpers"
# release = false                   # never released (also set publish = false in its Cargo.toml)
